spring:
  application:
    name: campus-pilot-ai
  config:
    import: optional:classpath:application-local.yml

logging:
  level:
    root: INFO

wechat:
  bot:
    enabled: ${WECHAT_BOT_ENABLED:true}
    download-dir: ${WECHAT_DOWNLOAD_DIR:downloads}
    qr-code-path: ${WECHAT_QR_CODE_PATH:wechat-login-qr.png}

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  compatible-api-url: ${DASHSCOPE_COMPATIBLE_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  api-url: ${DASHSCOPE_API_URL:https://dashscope.aliyuncs.com/api/v1}
  chat-model: ${DASHSCOPE_CHAT_MODEL:qwen-flash}
  intent-model: ${DASHSCOPE_INTENT_MODEL:qwen-flash}
  search-model: ${DASHSCOPE_SEARCH_MODEL:qwen-plus}
  translation-model: ${DASHSCOPE_TRANSLATION_MODEL:qwen-mt-flash}
  vision-model: ${DASHSCOPE_VISION_MODEL:qwen3-vl-flash}
  image-model: ${DASHSCOPE_IMAGE_MODEL:qwen-image-2.0}
  image-size: ${DASHSCOPE_IMAGE_SIZE:1024*1024}
  poster-image-model: ${DASHSCOPE_POSTER_IMAGE_MODEL:wan2.7-image-pro}
  poster-image-size: ${DASHSCOPE_POSTER_IMAGE_SIZE:1728*2368}
  asr-model: ${DASHSCOPE_ASR_MODEL:qwen3-asr-flash}
  tts-model: ${DASHSCOPE_TTS_MODEL:cosyvoice-v3-flash}
  tts-voice: ${DASHSCOPE_TTS_VOICE:longanyang}
  remote-intent-classification-enabled: ${REMOTE_INTENT_CLASSIFICATION_ENABLED:false}

audio:
  node-executable: ${NODE_EXECUTABLE:node}
  silk-decoder-script: ${SILK_DECODER_SCRIPT:scripts/decode-silk.mjs}
  sample-rate: ${SILK_SAMPLE_RATE:24000}
  decode-timeout-seconds: ${SILK_DECODE_TIMEOUT_SECONDS:30}

weather:
  api-key: ${SENIVERSE_API_KEY:}
  api-url: ${SENIVERSE_API_URL:https://api.seniverse.com/v3/weather/now.json}
  forecast-api-url: ${SENIVERSE_FORECAST_API_URL:https://api.seniverse.com/v3/weather/daily.json}

amap:
  api-key: ${AMAP_WEB_SERVICE_API_KEY:}
  geocode-api-url: ${AMAP_GEOCODE_API_URL:https://restapi.amap.com/v3/geocode/geo}
  place-around-api-url: ${AMAP_PLACE_AROUND_API_URL:https://restapi.amap.com/v5/place/around}
  search-radius-meters: ${AMAP_CAMPUS_SEARCH_RADIUS_METERS:2500}
  max-candidates: ${AMAP_CAMPUS_MAX_CANDIDATES:6}

rag:
  enabled: ${RAG_ENABLED:true}
  knowledge-base: ${RAG_KNOWLEDGE_BASE:classpath:rag/knowledge-base.json}
  max-results: ${RAG_MAX_RESULTS:3}

skills:
  daily-brief:
    default-location: ${DAILY_BRIEF_DEFAULT_LOCATION:北京}
    default-news-topic: ${DAILY_BRIEF_DEFAULT_NEWS_TOPIC:人工智能}
    news-limit: ${DAILY_BRIEF_NEWS_LIMIT:3}

agent:
  campus:
    checkpoint-dir: ${CAMPUS_AGENT_CHECKPOINT_DIR:data/campus-agent-checkpoints}
    conversation-ttl-minutes: ${CAMPUS_CONVERSATION_TTL_MINUTES:120}
    poster:
      enabled: ${CAMPUS_POSTER_ENABLED:true}
      canvas-width: ${CAMPUS_POSTER_CANVAS_WIDTH:1080}
      canvas-height: ${CAMPUS_POSTER_CANVAS_HEIGHT:1440}
      logo-resource-directory: ${CAMPUS_POSTER_LOGO_RESOURCE_DIRECTORY:poster-templates/logos}
      background-quality-review-enabled: ${CAMPUS_POSTER_BACKGROUND_QUALITY_REVIEW_ENABLED:true}
      max-background-attempts: ${CAMPUS_POSTER_MAX_BACKGROUND_ATTEMPTS:3}
      minimum-background-score: ${CAMPUS_POSTER_MINIMUM_BACKGROUND_SCORE:72}
